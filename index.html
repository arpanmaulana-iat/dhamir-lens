<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Dhamir-Lens — Visualisasi Interaktif Qawaid Marja' al-Dhamir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #f6f5f0;
      }
      .font-arab {
        font-family: 'Amiri', serif;
        font-feature-settings: "liga" 1, "calt" 1;
      }
      .kanvas-mushaf {
        background-color: #fcfbf7;
        background-image: radial-gradient(#d6d3c9 0.65px, transparent 0.65px);
        background-size: 18px 18px;
      }
      @keyframes dashFlow {
        to {
          stroke-dashoffset: -20;
        }
      }
      .animate-panah {
        animation: dashFlow 1.1s linear infinite;
      }
      /* Sembunyikan scrollbar horizontal pada pil kaidah di HP */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="text-slate-800 antialiased selection:bg-amber-200 selection:text-emerald-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
